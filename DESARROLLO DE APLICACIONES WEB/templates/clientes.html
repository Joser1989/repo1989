{% extends "base.html" %}
{% block title %}AL WORK - Clientes{% endblock %}
{% block content %}
<section class="container py-5">
  <h2 class="sec-title text-center">Nuestros Clientes</h2>
  <div class="text-center mt-3">
    <a href="{{ url_for('formulario_cliente') }}" class="btn btn-gold">+ Agregar cliente</a>
  </div>
  <table class="table table-striped mt-4">
    <thead>
      <tr><th>Nombre</th><th>Tipo de negocio</th><th>Contacto</th><th>Ciudad</th><th></th></tr>
    </thead>
    <tbody>
      {% for c in clientes %}
      <tr>
        <td>{{ c.nombre }}</td>
        <td>{{ c.tipo }}</td>
        <td>{{ c.contacto }}</td>
        <td>{{ c.ciudad }}</td>
        <td><a href="{{ url_for('formulario_cliente', cliente_id=loop.index0) }}" class="btn btn-sm btn-outline-dark">Editar</a></td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</section>
{% endblock %}
