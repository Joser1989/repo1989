{% extends "base.html" %}
{% block title %}AL WORK - Proveedores{% endblock %}
{% block content %}
<section class="container py-5">
  <h2 class="sec-title text-center">Nuestros Proveedores</h2>
  <div class="text-center mt-3">
    <a href="{{ url_for('formulario_proveedor') }}" class="btn btn-gold">+ Agregar proveedor</a>
  </div>
  <table class="table table-striped mt-4">
    <thead>
      <tr><th>Nombre</th><th>Tipo</th><th>Contacto</th><th>Ciudad</th><th></th></tr>
    </thead>
    <tbody>
      {% for p in proveedores %}
      <tr>
        <td>{{ p.nombre }}</td>
        <td>{{ p.tipo }}</td>
        <td>{{ p.telefono }}</td>
        <td>{{ p.ciudad }}</td>
        <td>
          <a href="{{ url_for('formulario_proveedor', proveedor_id=p.id_proveedor) }}" class="btn btn-sm btn-outline-dark">Editar</a>
          <form action="{{ url_for('eliminar_proveedor', proveedor_id=p.id_proveedor) }}" method="POST" class="d-inline"
                onsubmit="return confirm('¿Seguro que deseas eliminar {{ p.nombre }}? Esta acción no se puede deshacer.');">
            <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</section>
{% endblock %}
