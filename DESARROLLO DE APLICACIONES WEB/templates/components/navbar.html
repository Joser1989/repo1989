<header>
  <div class="header-brand">
    <img src="{{ url_for('static', filename='img/logo_gold.png') }}" alt="Logo {{ empresa.nombre }}" />
    <div>
      <h1>AL <span>WORK</span></h1>
      <p class="header-slogan">Ropa de Trabajo</p>
    </div>
  </div>
</header>

<nav class="navbar navbar-expand-lg navbar-alwork">
  <div class="container">
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menuPrincipal">
      <ul class="navbar-nav mx-auto gap-1">
        <li class="nav-item"><a class="nav-link {% if active=='inicio' %}active{% endif %}" href="{{ url_for('inicio') }}">Inicio</a></li>
        <li class="nav-item"><a class="nav-link {% if active=='productos' %}active{% endif %}" href="{{ url_for('ver_productos') }}">Productos</a></li>
        <li class="nav-item"><a class="nav-link {% if active=='clientes' %}active{% endif %}" href="{{ url_for('ver_clientes') }}">Clientes</a></li>
        <li class="nav-item"><a class="nav-link {% if active=='proveedores' %}active{% endif %}" href="{{ url_for('ver_proveedores') }}">Proveedores</a></li>
        <li class="nav-item"><a class="nav-link {% if active=='facturacion' %}active{% endif %}" href="{{ url_for('ver_facturacion') }}">Facturación</a></li>
      </ul>

      <ul class="navbar-nav ms-auto gap-1">
        {% if current_user.is_authenticated %}
          <li class="nav-item"><span class="nav-link disabled">Hola, {{ current_user.usuario }}</span></li>
          <li class="nav-item"><a class="nav-link {% if active=='dashboard' %}active{% endif %}" href="{{ url_for('dashboard') }}">Panel</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('logout') }}">Cerrar sesión</a></li>
        {% else %}
          <li class="nav-item"><a class="nav-link {% if active=='login' %}active{% endif %}" href="{{ url_for('login') }}">Iniciar sesión</a></li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
